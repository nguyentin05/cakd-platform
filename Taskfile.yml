version: '3'
vars:
  BINARY: cakd-cli
  CMD_PATH: ./cmd/cakd-cli
  OUT_DIR: bin
tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all platform binaries (cakd-cli, cakd-agent, cakd-mcp)
    cmds:
      - go build -ldflags "-s -w -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.VERSION}}" -o {{.OUT_DIR}}/cakd-cli ./cmd/cakd-cli
      - go build -ldflags "-s -w -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.VERSION}}" -o {{.OUT_DIR}}/cakd-agent ./cmd/cakd-agent
      - go build -ldflags "-s -w -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.VERSION}}" -o {{.OUT_DIR}}/cakd-mcp ./cmd/cakd-mcp
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.OUT_DIR}}/cakd"
      - "{{.OUT_DIR}}/cakd-agent"
      - "{{.OUT_DIR}}/cakd-mcp"

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./... -v -race -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  :short:
    desc: Run unit tests (short mode)
    cmds:
      - go test ./... -short

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .
      - go run golang.org/x/tools/cmd/goimports@v0.31.0 -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  schema:gen:
    desc: Generate platform.yaml JSON Schema
    cmds:
      - go run ./cmd/cakd-tools/schema-gen -o schemas/platform.schema.json

  docs:build:
    desc: Build MkDocs documentation strictly
    cmds:
      - mkdocs build --strict

  docs:serve:
    desc: Serve MkDocs documentation locally
    cmds:
      - mkdocs serve

  trivy:fs:
    desc: Scan filesystem for vulnerabilities
    cmds:
      - trivy fs --severity HIGH,CRITICAL --skip-dirs out --skip-files .env .

  trivy:config:
    desc: Scan IaC configs (Terraform, Helm, Dockerfile)
    cmds:
      - trivy config .

  trivy:image:
    desc: Scan Docker image
    cmds:
      - trivy image ghcr.io/{{.OWNER}}/{{.BINARY}}:latest
    vars:
      OWNER:
        sh: git remote get-url origin 2>/dev/null | sed -n 's/.*github.com[:/]\([^/]*\).*/\1/p' || echo "nguyentin05"

  gitleaks:
    desc: Scan for secrets in git history
    cmds:
      - gitleaks detect --source . --verbose

  release:snapshot:
    desc: Build release artifacts (snapshot, no publish)
    cmds:
      - goreleaser release --snapshot --clean

  release:check:
    desc: Validate GoReleaser config
    cmds:
      - goreleaser check

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ out/ dist/ site/ coverage.out

  ci:
    desc: Run all CI checks locally
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: build
      - task: trivy:fs

  validate:
    desc: Validate sample platform.yaml
    cmds:
      - go run {{.CMD_PATH}} validate -f platform.yaml

  generate:
    desc: Run code generation (bootstrap) with sample config
    cmds:
      - go run {{.CMD_PATH}} create -f platform.yaml
