alertmanager:
  config:
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'cakd-agent'
    receivers:
    - name: 'cakd-agent'
      webhook_configs:
      - url: 'http://cakd-agent.monitoring.svc.cluster.local:8080/api/v1/alerts'
        send_resolved: true
    - name: 'null'
