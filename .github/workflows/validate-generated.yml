name: Validate Generated

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CAKD CLI
        run: go build -o bin/cakd ./cmd/cakd

      - name: Run CAKD Create (Generate Templates Only)
        run: |
          cat << 'EOF' > platform.yaml
          apiVersion: platform.dev/v1alpha1
          kind: Project
          metadata:
            name: my-app
            owner: test-owner
          providers:
            versionControl: github
            ci: github-actions
            cd: argocd
          services:
            - name: api
              language: java-spring-boot
          EOF
        
          export GITHUB_TOKEN=""
          ./bin/cakd create -f platform.yaml || true

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Helm Lint
        run: helm lint out/*/services/*/helm
