run:
  timeout: 5m

linters:
  enable:
    # Bugs
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - typecheck

    # Style
    - gofmt
    - goimports
    - misspell

    # Complexity
    - gocyclo
    - goconst

    # Security
    - gosec

    # Performance
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  gosec:
    excludes:
      - G304

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 3
