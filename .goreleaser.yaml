version: 2

project_name: cakd

before:
  hooks:
    - go mod tidy

builds:
  - id: cakd-cli
    main: ./cmd/cakd-cli
    binary: cakd-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.Version}}

  - id: cakd-agent
    main: ./cmd/cakd-agent
    binary: cakd-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.Version}}

  - id: cakd-mcp
    main: ./cmd/cakd-mcp
    binary: cakd-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nguyentin05/cakd-platform/internal/platform/buildinfo.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: nguyentin05
    name: cakd-platform
  mode: keep-existing
  draft: false
